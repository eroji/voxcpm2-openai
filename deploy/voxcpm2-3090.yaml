# VoxCPM2 deploy config for vLLM-Omni 0.30.0, sized for a shared 24 GB RTX 3090.
# Validated on the vllm host (GPU 1): ~9.3 GB VRAM, warm RTF ~0.14, ~154 ms to first
# streamed audio. Derived from vllm_omni/deploy/voxcpm2.yaml with:
#   max_num_seqs 8 -> 2, gpu_memory_utilization 0.9 -> 0.4,
#   kv_cache_memory_bytes 6 GiB -> 2 GiB, unified_decode_graph_max_batch_size 8 -> 2.
# devices "0" is correct: the container only sees the speech card (CDI).
async_chunk: false
dtype: bfloat16
stages:
  - stage_id: 0
    max_num_seqs: 2
    gpu_memory_utilization: 0.4
    kv_cache_memory_bytes: 2147483648   # 2 GiB, single-user
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    engine_extras:
      hf_overrides:
        voxcpm2_runtime_config:
          audio_emit_every: 1
          vae_decode_every: 3
          enable_batched_cfm: true
          enable_batched_vae_decode: true
          coalesce_audio_d2h: true
          enable_loc_dit_fused_qkv: true
          enable_loc_dit_fused_mlp: true
          enable_loc_dit_zero_dt_cache: true
          enable_loc_dit_skip_qkv_contig: true
          enable_loc_dit_reduce_overhead_no_cg: true
          enable_unified_decode_graph: true
          unified_decode_graph_max_batch_size: 2
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.0
