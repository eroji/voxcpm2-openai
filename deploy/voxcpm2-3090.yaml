# VoxCPM2 deploy config for vLLM-Omni 0.30.0, sized for a shared 24 GB RTX 3090.
# Multi-user profile: 4 active sequences + 16 app-queued requests. Validated on the vllm
# host (GPU 1); raise/lower max_num_seqs, kv_cache_memory_bytes and the app's
# ENGINE_CONCURRENCY together. Leave headroom for whisper-stt and TEI on the same card.
# Derived from vllm_omni/deploy/voxcpm2.yaml:
#   max_num_seqs 8 -> 4, gpu_memory_utilization 0.9 -> 0.5,
#   kv_cache_memory_bytes 6 GiB -> 4 GiB, unified_decode_graph_max_batch_size 8 -> 4,
#   max_num_batched_tokens 4096 -> 8192.
# devices "0" is correct: the container only sees the speech card (CDI).
# Field-by-field reference: README.md § "Engine deploy config reference" and
# https://docs.vllm.ai/projects/vllm-omni/en/latest/configuration/stage_configs/
async_chunk: false
dtype: bfloat16
stages:
  - stage_id: 0
    max_num_seqs: 4
    gpu_memory_utilization: 0.5
    kv_cache_memory_bytes: 4294967296   # 4 GiB for 4 concurrent sequences
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 8192
    max_model_len: 4096
    devices: "0"
    engine_extras:
      hf_overrides:
        voxcpm2_runtime_config:
          audio_emit_every: 1
          vae_decode_every: 3
          enable_batched_cfm: true
          enable_batched_vae_decode: true
          coalesce_audio_d2h: true
          enable_loc_dit_fused_qkv: true
          enable_loc_dit_fused_mlp: true
          enable_loc_dit_zero_dt_cache: true
          enable_loc_dit_skip_qkv_contig: true
          enable_loc_dit_reduce_overhead_no_cg: true
          enable_unified_decode_graph: true
          unified_decode_graph_max_batch_size: 4
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 4096
      seed: 42
      repetition_penalty: 1.0
