# CI is intentionally minimal: build and publish the container image. Deploy is opt-in.
# All code quality gates (format, lint, types, unit/integration, e2e, package checks) run
# locally via scripts/verify.sh; they are not repeated in CI on purpose.
#
# Required CI variables (Settings > CI/CD > Variables; masked):
#   HARBOR_USER   Harbor user/robot with push rights to dotslash/voxcpm2-openai.
#   HARBOR_TOKEN  Its password or robot token, used for `docker login`.
# Optional CD variables (off unless DEPLOY_TARGET is set):
#   DEPLOY_TARGET=staging|production, DEPLOY_SSH_KEY (base64 -w0 of an ed25519 key),
#   DEPLOY_HOST (default vllm.dotslash.io), DEPLOY_USER (default deploy),
#   DEPLOY_PATH (default /opt/voxcpm2-openai).
#
# Only tags build: `git tag v0.1.0 && git push origin v0.1.0` builds/pushes :v0.1.0 and :latest.
# Pushes to main and ordinary commits never create a pipeline.

workflow:
  rules:
    # Only release tags build; branch/commit pushes never create a pipeline.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages: [build, deploy]

variables:
  HARBOR_IMAGE: "harbor.dotslash.io/dotslash/voxcpm2-openai"

build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  interruptible: true
  variables:
    # Tags are needed for the release tag; dind listens on plain tcp://docker:2375 when
    # the cert dir is empty (matches the runner's tls_verify=false).
    GIT_DEPTH: 0
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
  before_script:
    - |
      if [ -z "${HARBOR_USER:-}" ] || [ -z "${HARBOR_TOKEN:-}" ]; then
        echo "HARBOR_USER and HARBOR_TOKEN must be set as CI/CD variables."
        echo "For tag pipelines they must be unprotected (or the tag must be protected)."
        exit 1
      fi
      echo "$HARBOR_TOKEN" | docker login harbor.dotslash.io -u "$HARBOR_USER" --password-stdin
  script:
    - |
      TAG="$CI_COMMIT_TAG"
      echo "Building $HARBOR_IMAGE:$TAG (and :latest)"
      docker build -f deploy/Containerfile -t "$HARBOR_IMAGE:$TAG" -t "$HARBOR_IMAGE:latest" .
      docker push "$HARBOR_IMAGE:$TAG"
      docker push "$HARBOR_IMAGE:latest"
      echo "DEPLOY_IMAGE=$HARBOR_IMAGE:$TAG" > build.env
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: build.env

# ------------------------------------------------------------------ deploy
# Same shape as the notely deploy job: ssh directly to $DEPLOY_USER@$DEPLOY_HOST with
# DEPLOY_SSH_KEY, log in to Harbor over stdin, update the image tag, recreate with podman.
deploy:
  stage: deploy
  image: alpine:latest
  timeout: 20 minutes
  needs: [build]
  environment: production
  variables:
    DEPLOY_HOST: vllm.dotslash.io
    DEPLOY_USER: deploy
    DEPLOY_PATH: /opt/voxcpm2-openai
    HEALTH_URL: http://127.0.0.1:8881/ready
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - when: never
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - printf '%s' "$DEPLOY_SSH_KEY" | tr -dc 'A-Za-z0-9+/=' | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
  script:
    - export IMAGE_TAG="$CI_COMMIT_TAG"
    - printf '%s' "$HARBOR_TOKEN" > /tmp/harbor_token && chmod 600 /tmp/harbor_token
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "sudo -n podman login harbor.dotslash.io -u '$HARBOR_USER' --password-stdin" < /tmp/harbor_token
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "mkdir -p $DEPLOY_PATH && cat > $DEPLOY_PATH/compose.yaml" < deploy/compose.yaml
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "cat > $DEPLOY_PATH/compose.config.yaml" < deploy/compose.config.yaml
    - |
      ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
        "$DEPLOY_USER@$DEPLOY_HOST" \
        "bash -s -- '$HARBOR_IMAGE:$IMAGE_TAG' '$HEALTH_URL'" <<'REMOTE'
      set -euo pipefail
      IMAGE="$1"; HEALTH="$2"
      cd /opt/voxcpm2-openai
      touch .env
      grep -v '^VOXCPM2_IMAGE=' .env > .env.tmp || true
      printf 'VOXCPM2_IMAGE=%s\n' "$IMAGE" >> .env.tmp
      mv .env.tmp .env
      chmod 600 .env
      export VOXCPM2_IMAGE="$IMAGE"
      # A host-managed YAML is opt-in via VOXCPM2_DEPLOY_CONFIG in .env; otherwise the
      # image's baked /opt/app/deploy/voxcpm2-3090.yaml remains in use.
      COMPOSE_FILES="-f compose.yaml"
      if grep -q '^VOXCPM2_DEPLOY_CONFIG=' .env; then
        COMPOSE_FILES="$COMPOSE_FILES -f compose.config.yaml"
      fi
      sudo -n podman-compose $COMPOSE_FILES pull
      sudo -n podman-compose $COMPOSE_FILES up -d --force-recreate --remove-orphans
      for i in $(seq 1 60); do
        if curl -fsS "$HEALTH" >/dev/null; then echo READY; exit 0; fi
        sleep 10
      done
      sudo -n podman logs --tail 120 voxcpm2-openai || true
      exit 1
      REMOTE
