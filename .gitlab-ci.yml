# GitLab CI — mandatory checks. CD is opt-in only (DEPLOY_TARGET=staging|production).

stages: [checks, test, e2e, build, package, deploy]

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  DEPLOY_IMAGE: "harbor.dotslash.io/dotslash/voxcpm2-openai:$CI_COMMIT_SHORT_SHA"

default:
  image: python:3.12-slim
  interruptible: true
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/pip]
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
    - python -m pip install -q --upgrade pip
    - python -m pip install -q -e '.[dev]'
    - export PYTHON=python

checks:
  stage: checks
  parallel:
    matrix:
      - CHECK: [format, lint, types]
  script:
    - |
      case "$CHECK" in
        format) python -m ruff format --check app tests scripts ;;
        lint)   python -m ruff check app tests scripts ;;
        types)  python -m mypy app ;;
      esac

test:
  stage: test
  script:
    - python -m pytest tests --ignore=tests/e2e
        --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=65
  coverage: '/^TOTAL.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [coverage.xml]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

e2e:
  stage: e2e
  script:
    - python -m playwright install --with-deps chromium
    - python -m pytest tests/e2e -q
  artifacts:
    when: always
    expire_in: 1 week
    paths: [test-results/]

javascript:
  stage: checks
  image: node:22-alpine
  script:
    - for f in app/static/js/*.js; do node --check "$f"; done
    - echo "all static modules parse"

build:
  stage: build
  script:
    - python -m build
  artifacts:
    expire_in: 1 week
    paths: [dist/]

# Container package: needs Harbor credentials (HARBOR_USER/HARBOR_PASSWORD) as masked CI
# variables. Without them a static contract check still runs, so the pipeline never silently
# skips packaging. Enable the real build by setting the variables.
package:
  stage: package
  image: docker:27
  services: [docker:27-dind]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash
  script:
    - |
      if [ -n "${HARBOR_USER:-}" ] && [ -n "${HARBOR_PASSWORD:-}" ]; then
        echo "$HARBOR_PASSWORD" | docker login harbor.dotslash.io -u "$HARBOR_USER" --password-stdin
        docker build -f deploy/Containerfile -t "$DEPLOY_IMAGE" .
        docker push "$DEPLOY_IMAGE"
      else
        echo "Harbor credentials not configured: validating Containerfile contract instead"
        grep -q 'COPY app/ /opt/app/' deploy/Containerfile
        grep -q 'voxcpm2-3090.yaml' deploy/Containerfile
        test -d deploy/s6/engine && test -d deploy/s6/app
      fi

# ---------------------------------------------------------------- CD (opt-in)
# Nothing below runs unless DEPLOY_TARGET is set. Production additionally requires a tag and
# a manual approval. See docs/RUNBOOK.md §"Turning on CD".
deploy:staging:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  needs: [package]
  rules:
    - if: '$DEPLOY_TARGET == "staging" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
    - when: never
  script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)" && echo "$DEPLOY_SSH_KEY" | ssh-add -
    - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST"
        "cd $DEPLOY_PATH && DEPLOY_IMAGE=$DEPLOY_IMAGE docker compose -f deploy/compose.yaml pull && DEPLOY_IMAGE=$DEPLOY_IMAGE docker compose -f deploy/compose.yaml up -d --remove-orphans"

deploy:production:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  needs: [package]
  rules:
    - if: '$DEPLOY_TARGET == "production" && $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
      allow_failure: false
    - when: never
  environment:
    name: production
    url: http://vllm.dotslash.io:8880
  script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)" && echo "$DEPLOY_SSH_KEY" | ssh-add -
    - ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_HOST"
        "cd $DEPLOY_PATH && DEPLOY_IMAGE=$DEPLOY_IMAGE docker compose -f deploy/compose.yaml pull && DEPLOY_IMAGE=$DEPLOY_IMAGE docker compose -f deploy/compose.yaml up -d --remove-orphans"
    - ssh "$DEPLOY_HOST" "curl -fsS http://127.0.0.1:8880/ready"
